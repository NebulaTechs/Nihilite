plugins {
  id 'java'
  id 'application'
}
group = 'nihilite'
version = '0.1'

java {
  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
}

repositories {
  mavenCentral()
  maven { url = 'https://repo.clojars.org' }
}

dependencies {
  implementation 'org.clojure:clojure:1.12.5'
  implementation 'org.clojure:spec.alpha:0.5.238'
  implementation 'org.clojure:core.specs.alpha:0.4.74'
  implementation 'org.clojure:tools.logging:1.3.1'
  implementation 'nrepl:nrepl:1.7.0'
  implementation 'net.bytebuddy:byte-buddy:1.18.13'
  implementation 'net.bytebuddy:byte-buddy-agent:1.18.13'
}

application {
  mainClass = 'nihilite.boot'
}

configurations {
  aopCompileClasspath {
    extendsFrom configurations.runtimeClasspath
  }
}

def nihiliteNamespaces = [
  'nihilite.api',
  'nihilite.attach',
  'nihilite.boot',
  'nihilite.debug',
  'nihilite.pointcut',
  'nihilite.registry',
  'nihilite.transport',
  'nihilite.version'
]

def aopCompile = tasks.register('aopCompile', JavaExec) {
  description = 'AOP-compile nihilite namespaces to .class'
  group = 'build'
  dependsOn compileJava
  classpath = configurations.aopCompileClasspath + files("$buildDir/classes/java/main") + files('src/main/clojure')
  mainClass = 'nihilite.build.AotCompile'
  args 'src/main/clojure', 'build/classes/java/main'
  args nihiliteNamespaces
}

jar {
  archiveFileName = 'nihilite.jar'
  manifest {
    attributes(
      'Premain-Class': 'nihilite.agent.Agent',
      'Agent-Class': 'nihilite.agent.Agent',
      'Can-Redefine-Classes': 'true',
      'Can-Retransform-Classes': 'true',
      'Main-Class': application.mainClass.get(),
      'Implementation-Title': 'Nihilite',
      'Multi-Release': 'true')
  }
  from sourceSets.main.output
  dependsOn aopCompile
  exclude '**/*.clj', '**/*.cljc'
  from {
    configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
  }
  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task verifyJarContents {
  dependsOn jar
  description = 'Fail the build if the produced jar bundles any examples/* or other forbidden entry.'
  doLast {
    def jarFile = file('build/libs/nihilite.jar')
    def forbidden = ['examples/', 'minecraft/', 'fabric/', 'init.clj', 'server.properties']
    def found = []
    zipTree(jarFile).visit { f ->
      def name = f.file.absolutePath.replace('\\', '/')
      forbidden.each { pat -> if (name.endsWith(pat) || name.contains('/' + pat)) found << name }
    }
    if (found) {
      throw new GradleException("Forbidden entries bundled in jar: ${found.unique()}")
    }
  }
}

task smoke {
  dependsOn jar
  description = 'Spawn a JVM with nihilite javaagent + smoke init form and probe nrepl'
  doLast {
    def javaBin = System.getProperty('java.home') + '/bin/java'
    def initForm = '(load-file "examples/jdkstdlib/init.clj")'
    def port = System.getProperty('nihilite.port', '18189')
    def bind = System.getProperty('nihilite.bind', '127.0.0.1')
    def serverLog = new File(buildDir, 'smoke-server.log')
    def probeLog = new File(buildDir, 'smoke-probe.log')
    serverLog.delete(); probeLog.delete()
    def server = new java.lang.ProcessBuilder(
      javaBin,
      "-javaagent:${jar.archiveFile.get().asFile.absolutePath}",
      "-Dnihilite.port=${port}",
      "-Dnihilite.bind=${bind}",
      "-Dnihilite.init=${initForm}",
      "-jar", jar.archiveFile.get().asFile.absolutePath
    ).redirectErrorStream(true).redirectOutput(serverLog).start()
    def deadline = System.currentTimeMillis() + 45_000L
    def ready = false
    while (System.currentTimeMillis() < deadline) {
      if (serverLog.text.contains("bound ${bind}:${port}")) { ready = true; break }
      Thread.sleep(500L)
    }
    if (!ready) {
      server.destroyForcibly()
      throw new GradleException("smoke FAIL: server did not bind ${bind}:${port} within 45s; see ${serverLog}")
    }
    def bencodeHost = new File(repoRoot ?: rootDir, 'scripts/bencode-probe.groovy')
    def probeCmd = [javaBin, '-jar', jar.archiveFile.get().asFile.absolutePath]
    probeLog.text = "smoke server bound, but bencode probe not implemented in this task — see ${serverLog}\n"
    server.destroyForcibly()
    if (!serverLog.text.contains('loaded. Read a file')) {
      throw new GradleException("smoke FAIL: init did not run; see ${serverLog}")
    }
    println "smoke PASS: server bound on ${bind}:${port}; init ran"
  }
}

check {
  dependsOn verifyJarContents
}

test {
  dependsOn aopCompile
  testLogging.showStandardStreams = false
  failOnNoDiscoveredTests = false
}

sourceSets {
  main {
    resources {
      srcDirs += ['src/main/clojure']
    }
  }
  test {
    resources {
      srcDirs = ['src/test/clojure']
    }
  }
}

def clojureContractTest = tasks.register('clojureContractTest', JavaExec) {
  description = 'Run nihilite Clojure contract tests via nihilite.test.runner'
  group = 'verification'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'clojure.main'
  args '-m', 'nihilite.test.runner'
  systemProperty 'nrepl.disable.tools', 'true'
}

def retransformDriver = tasks.register('retransformDriver', JavaExec) {
  description = 'In-process driver proving HookInstaller + retransform works'
  group = 'verification'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'nihilite.test.retransformDriver'
  jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
}

def compilerLoaderHintDriver = tasks.register('compilerLoaderHintDriver', JavaExec) {
  description = 'Driver proving Worker.resolveHostClassLoader picks the right loader'
  group = 'verification'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'nihilite.test.compilerLoaderHintDriver'
  jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
}

def javaagentClasspathDriver = tasks.register('javaagentClasspathDriver', JavaExec) {
  description = 'Driver proving nihilite.jar + -javaagent + -jar brings nrepl server up + init ran'
  group = 'verification'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'nihilite.javaagentClasspathDriver'
  jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
  systemProperty 'nihilite.compiler-loader-hint', ''
  args 'spawn-jar-smoke', jar.archiveFile.get().asFile.absolutePath, 'examples/jdkstdlib/init.clj'
}

def redefineInstanceDriver = tasks.register('redefineInstanceDriver', JavaExec) {
  description = 'Driver proving @This optional captures the host instance for :redefine on instance methods'
  group = 'verification'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'nihilite.test.redefineInstanceDriver'
  jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
}

check {
  dependsOn clojureContractTest, verifyJarContents, retransformDriver, compilerLoaderHintDriver, javaagentClasspathDriver, redefineInstanceDriver
}
