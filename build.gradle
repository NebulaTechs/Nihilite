// Nihilite build. ONE artifact in production form:
//
//   - build/libs/nihilite.jar                 (the fat jar; both `java -jar`
//                                              and `java -javaagent:nihilite.jar`
//                                              resolve off this single file)
//
// The fat jar bundles Clojure 1.12.0 + spec.alpha + core.specs.alpha + nrepl
// 1.7.0 + the existing single-port dispatcher (nihilite.transport) + the
// hooks package (nihilite.hooks.*) + nihilite.server.ServerMain (Main-Class)
// + nihilite.agent.Agent (Premain-Class + Agent-Class). One binary, two
// entry points:
//
//   standalone: `java -jar nihilite.jar`         -> Main-Class  -> ServerMain
//   attached :  `java -javaagent:nihilite.jar -jar <minecraft.jar>`
//                                            -> Premain-Class -> Agent
//
// All dependencies are declared here, not hardcoded in build.sh.

plugins {
    id 'java'
    id 'application'
}

group = 'nihilite'
// Static version. Kept stable so Gradle task input hashing does not
// flip on every invocation (which would invalidate the Java compile
// + jar task caches for unchanged sources). Build-time/date metadata
// is logged to stdout from the jar task instead of pinned into the
// artifact version, so the produced nihilite.jar is byte-stable
// when nothing changed.
version = 'dev-SNAPSHOT'

java {
    // Minecraft 26.1 requires Java 25. We compile to class file v69.
    // sourceCompatibility/targetCompatibility VERSION_25 was added in
    // Gradle 9.1+; before that, the enum value was unrecognized.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.clojars.org' }
}

dependencies {
    // Clojure language runtime
    implementation 'org.clojure:clojure:1.12.0'
    // Clojure spec (separate artifact since 1.9)
    implementation 'org.clojure:spec.alpha:0.5.238'
    implementation 'org.clojure:core.specs.alpha:0.4.74'
    // nREPL server (Clojars-only) — provides the bencode transport.
    // The HTTP and raw-TCP transports reuse nREPL's bencode parsing
    // and route through nrepl.server/handle, so no extra deps.
    implementation 'nrepl:nrepl:1.7.0'

    // clojure.tools.logging — Clojure-side facade over java.util.logging
    // (no SLF4J/log4j on the classpath so the auto-detect chain lands on
    // java.util.logging, which keeps the log channel unified with the
    // Java side). Provides log/info, log/warn, log/error, log/debug.
    implementation 'org.clojure:tools.logging:1.3.1'

    // JLine 3 — proper readline for the raw branch. The single-bundle
    // `org.jline:jline` artifact pulls terminal + reader + style;
    // builds a Terminal over our socket InputStream/OutputStream so
    // we get C-a/e/k/y/u/w, ESC-b/f, left/right, C-r history search,
    // bracketed paste (ESC[200~/201~), tab completion, persistent
    // history (HISTORY_FILE var) — all the readline ergonomics that
    // used to be a 150-line bespoke parser in transport.clj.
    // 3.30.x is the latest 3.x release line; 4.x requires JDK 17+
    // and pulls in additional JPMS modules, so we stick to 3.30.x.
    implementation 'org.jline:jline:3.30.15'

    // ByteBuddy 1.18.11 — used by nihilite.hooks.HookInstaller (bytecode
    // retransform of already-loaded JVM classes at runtime, replacing the
    // previous JDK java.lang.classfile hand-rolled transformer). Java 25
    // class-file v69 support since 1.17.0; 1.18.11 is the latest 1.18.x.
    // byte-buddy itself bundles shaded ASM (~3MB transitively).
    // byte-buddy-agent is only used by retransformDriver for in-process
    // self-attach; the prod path uses -javaagent:nihilite.jar instead.
    implementation 'net.bytebuddy:byte-buddy:1.18.11'
    implementation 'net.bytebuddy:byte-buddy-agent:1.18.11'

    // Post-port-merge (2026-07-20): the 7889 Jetty sidecar is removed.
    // HTTP/WS are first-class dispatcher branches on the canonical
    // 7888 port; no second framework dependency. gson likewise drops
    // with the sidecar.
}

application {
    mainClass = 'nihilite.server.ServerMain'
}

// Source layout (Maven/Gradle conventional):
//   src/main/java/        → compiled to .class
//   src/main/clojure/     → packaged as resources so clojure.core/require
//                           can find them on the classpath
//   examples/             → external operator-side init files; NEVER packaged.
//                           They stay on disk and are discovered at runtime.
//   scripts/              → smoke + repl-loop utilities (not packaged)
sourceSets {
    main {
        // src/main/java is the Gradle default; explicit declaration here
        // is documentation only. The Clojure ns files live under
        // src/main/clojure and are emitted into the fat jar as
        // resources/nihilite/{boot,version,reload}.clj so that
        // clojure.core/require resolves them at runtime.
        // examples/ is intentionally absent — it is operator-side
        // filesystem content, not a build resource.
        resources {
            srcDirs = ['src/main/clojure']
        }
    }
}

// Local timestamp formatter for build-time logging only. Deliberately
// not used to drive any task input or artifact content — see the note
// on `version` above.
def buildTimestamp = {
    def fmt = new java.text.SimpleDateFormat('yyyyMMdd-HHmmss')
    fmt.setTimeZone(java.util.TimeZone.getDefault())
    fmt.format(new Date())
}

// Fat-jar assembly. Single artifact at build/libs/nihilite.jar with
// dual-manifest (Main-Class + Premain-Class + Agent-Class) so both
// `java -jar` and `-javaagent` resolve off the same file. No
// Boot-Class-Path (Java 9+ package split would corrupt
// clojure.* / spec.alpha.* / nrepl.* resolution). Fat-jar +
// system classloader is sufficient for the agent path.

jar {
    archiveFileName = 'nihilite.jar'
    manifest {
        attributes(
            'Implementation-Title': 'Nihilite',
            'Implementation-Version': project.version,
            // Standalone entry point: `java -jar nihilite.jar` -> ServerMain
            'Main-Class': application.mainClass.get(),
            // Attached entry point: `java -javaagent:nihilite.jar ...` -> Agent.premain
            // (Follow-up commit wires the real premain body; this class exists
            //  as a no-op stub today so the manifest resolves at agent parse.)
            'Premain-Class': 'nihilite.agent.Agent',
            'Agent-Class':   'nihilite.agent.Agent',
            // Hot rewriting of game behavior uses alter-var-root on Clojure
            // vars / protocols / namespaces, NOT bytecode retransform — BUT
            // nihilite.hooks.HookInstaller (ByteBuddy) can retransform an
            // already-loaded target class when the operator calls
            // (nihilite.hooks/install!) at REPL time and the class has
            // already been loaded by Minecraft / Fabric. Both flags must
            // therefore be `true`.
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            // No Boot-Class-Path. Java 9+ package split would corrupt
            // Clojure's clojure.* / spec.alpha.* / nrepl.* resolution.
            // Fat-jar + system classloader is sufficient.
            // Required so Package.getImplementationVersion() resolves
            // for the nihilite.server package inside a fat jar (otherwise
            // the JVM silently ignores our Implementation-Version).
            'Name': 'nihilite/server/'
        )
    }
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    // Build-time size log (development only — not driven from any task
    // input or artifact content; see the note on `version` above).
    doLast {
        def f = archiveFile.get().asFile
        if (f.exists()) {
            logger.lifecycle("[jar] ${f.name} built at dev-${buildTimestamp.call()} "
                             + "(size=${f.length()} bytes)")
        }
    }
}

tasks.register('sourcesJar', Jar) {
    archiveBaseName = 'nihilite'
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn sourcesJar
}

// JAR content gate. The agent/runtime fat jar must NEVER bundle
// operator-side filesystem content under examples/, nor any
// top-level init.clj / minecraft/init.clj / fabric/init.clj. Examples
// stay external — they are discovered at runtime, never packaged.
//
// verifyJarContents runs after :jar and fails the build if any forbidden
// entry slips in (e.g. via a future copy{} / shadow-merge mistake).
tasks.register('verifyJarContents') {
    dependsOn jar
    description = 'Fail the build if the produced jar bundles any examples/* or other forbidden entry.'
    group = 'verification'

    def forbidden = [
        'init.clj',
        'examples/',
        'minecraft/',
        'fabric/',
        'server.properties',
        'server.properties.example'
    ]

    doLast {
        def jarFile = jar.archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("verifyJarContents: jar archive missing at ${jarFile}")
        }
        def violations = []
        zipTree(jarFile).files.each { f ->
            def rel = f.absolutePath.substring(jarFile.absolutePath.length() + 1)
            forbidden.each { bad ->
                if (rel == bad || rel.startsWith(bad)) {
                    violations << rel
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "verifyJarContents FAILED — forbidden entries in ${jarFile.name}:\n" +
                violations.sort().unique().collect { "  - ${it}" }.join('\n') +
                "\nExamples must stay external — never bundled in the jar."
            )
        }
        logger.lifecycle("[verifyJarContents] OK — ${jarFile.name} contains no forbidden entries.")
    }
}

// Dependency-free contract-test / verification harness.
//
// The java plugin already creates a `test` task (type Test) which scans
// for JUnit tests. We must NOT register/delete/overwrite that task; we
// only disable it (it has no JUnit tests today, so `enabled = false` is
// correct). The contract-test runners below are JavaExec and run fully
// self-contained test sources; they have provider-safe wiring into the
// existing `check` lifecycle so `./gradlew --no-daemon check` invokes
// them in addition to the (disabled) java-plugin test.
tasks.named('test') { enabled = false }

sourceSets {
    test {
        // The Clojure test runner discovers `src/test/clojure/...`
        // resources via the test runtime classpath. Adding the Clojure
        // source root as a test-resources directory means the file
        // walking code in `nihilite.test.runner` and any future
        // Clojure contract tests are resolvable via `require`.
        resources {
            srcDirs = ['src/test/clojure']
        }
    }
}

def clojureContractTest = tasks.register('clojureContractTest', JavaExec) {
    description = 'Run nihilite Clojure contract tests via nihilite.test.runner'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'clojure.main'
    args '-m', 'nihilite.test.runner'
    systemProperty 'nrepl.disable.tools', 'true'
}

def contractCheck = tasks.register('contractCheck', JavaExec) {
    description = 'Contract EOC scanner + permanent-negative-fixture gate'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nihilite.test.ContractCheckRunner'
    jvmArgs '-Xverify:all'
    if (project.hasProperty('contractNegative')) {
        systemProperty 'contractNegative', project.property('contractNegative')
    }
    if (project.hasProperty('contractStrict')) {
        systemProperty 'contractStrict', project.property('contractStrict')
    }
    // Allow operators to enable the negative mode from CLI: e.g.
    // `./gradlew --no-daemon contractCheck -PcontractNegative=1`.
    // -PcontractStrict=1 enables F5 strictness.
    doFirst {
        if (project.hasProperty('contractNegative')) {
            systemProperty 'contractNegative', project.property('contractNegative')
        }
        if (project.hasProperty('contractStrict')) {
            systemProperty 'contractStrict', project.property('contractStrict')
        }
    }
}

// Wire both runners into the standard `check` lifecycle task so
// `./gradlew --no-daemon check` enforces both. The jar-content gate
// runs alongside them so a release build cannot accidentally bundle
// examples.
tasks.named('check') {
    dependsOn clojureContractTest, contractCheck, verifyJarContents
}

// Pure-JVM in-process driver for nihilite.hooks.HookInstaller.
// Self-attaches via ByteBuddyAgent.install() (requires
// -Djdk.attach.allowAttachSelf=true on JDK 9+). Exits 0 with
// "DRIVER_PASS retransform-already-loaded proven" on success.
def retransformDriver = tasks.register('retransformDriver', JavaExec) {
    description = 'In-process driver proving HookInstaller + retransform works'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nihilite.test.retransformDriver'
    jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
    if (project.hasProperty('bbdump')) {
        systemProperty 'net.bytebuddy.dump', project.property('bbdump')
    }
}


