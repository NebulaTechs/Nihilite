name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [master]
    tags:
      - 'nightly'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: nihilite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared step blocks (kept inline per job so each job is self-contained;
# a template step file is not worth it for five jobs).
#
# Structure:
#   test-11 / test-17 / test-21 / test-25 — compile + contract tests +
#                        all driver probes, in parallel. JDK 8 is not
#                        supported: the invokedynamic bootstrap contract is
#                        incompatible there (CallSite.makeSite expands the
#                        static arguments there and passes them whole from
#                        JDK 9 on), and indy is the only dispatch path.
#   publish            — build uberjar + verify + smoke + upload + nightly
#                        release. Needs ALL four test jobs to pass, runs on
#                        JDK 25 only, and is skipped on pull_request
#                        (PRs get the test gate, only pushes to master /
#                        nightly tags publish).

jobs:
  test-11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-11-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-11-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build redefine-instance-driver
          clojure -T:build javaagent-driver
          clojure -T:build eval-attach-driver
          clojure -T:build indy-driver
          clojure -T:build prod-bootstrap-driver
          clojure -T:build dual-loader-driver
          clojure -T:build concurrent-invoke-driver
          clojure -T:build multi-hook-fanout-driver

  test-17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-17-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-17-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build redefine-instance-driver
          clojure -T:build javaagent-driver
          clojure -T:build eval-attach-driver
          clojure -T:build indy-driver
          clojure -T:build prod-bootstrap-driver
          clojure -T:build dual-loader-driver
          clojure -T:build concurrent-invoke-driver
          clojure -T:build multi-hook-fanout-driver

  test-21:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-21-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-21-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build redefine-instance-driver
          clojure -T:build javaagent-driver
          clojure -T:build eval-attach-driver
          clojure -T:build indy-driver
          clojure -T:build prod-bootstrap-driver
          clojure -T:build dual-loader-driver
          clojure -T:build concurrent-invoke-driver
          clojure -T:build multi-hook-fanout-driver

  test-25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-25-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-25-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build redefine-instance-driver
          clojure -T:build javaagent-driver
          clojure -T:build eval-attach-driver
          clojure -T:build indy-driver
          clojure -T:build prod-bootstrap-driver
          clojure -T:build dual-loader-driver
          clojure -T:build concurrent-invoke-driver
          clojure -T:build multi-hook-fanout-driver

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-11, test-17, test-21, test-25]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-25-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-25-

      - name: Build uberjar
        run: clojure -T:build uberjar

      - name: Verify jar contents
        run: clojure -T:build verify-jar

      - name: Smoke test the shipped jar
        run: |
          set -euo pipefail

          # `java -jar` reaches Main-Class, which is handed a nil
          # Instrumentation: it can never weave, so it does not try. It prints
          # a stub notice and returns 0. This used to wait for a server banner
          # from a feature that no longer exists, so the step failed on a jar
          # that was working exactly as designed.
          java -jar target/nihilite.jar > /tmp/nihilite-main.log 2>&1
          echo "--- java -jar output ---"
          cat /tmp/nihilite-main.log
          grep -q 'bytecode hook agent for the JVM' /tmp/nihilite-main.log
          grep -q 'nothing to run here' /tmp/nihilite-main.log

          # Then the part that actually matters for a published artifact:
          # mount it into a real JVM and prove a hook weaves and fires. This
          # is the only assertion in CI that exercises the shipped jar through
          # the production install! path.
          clojure -T:build javaagent-driver

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nihilite.jar
          path: target/nihilite.jar
          retention-days: 14

      - name: Update nightly tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly ${{ github.sha }}
          git push -f origin nightly

      - name: Publish nightly release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          files: target/nihilite.jar
          prerelease: true
          generate_release_notes: false
          body: |
            This is the upload-based build of the current `${{ github.ref_name }}`.

            This is **not** a release. It is a continuous build artifact that
            gets overwritten on every CI run.

            Build metadata:
            - commit: ${{ github.sha }}
            - ref: ${{ github.ref_name }}
            - run: ${{ github.run_id }}
            - actor: ${{ github.actor }}
