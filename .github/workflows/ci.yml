name: ci

on:
  # No paths-ignore. Removing only `docs/**` would have changed nothing:
  # `**/*.md` already matches docs/*.md, which is how a fabricated claim in
  # docs/hook-limits.md stayed invisible here for as long as it existed.
  pull_request:
  push:
    branches: [master]
    tags:
      - 'nightly'

concurrency:
  group: nihilite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared step blocks (kept inline per job so each job is self-contained;
# a template step file is not worth it for five jobs).
#
# Structure:
#   test-11 / test-17 / test-21 / test-25 — one `check` task per job, in
#                        parallel: the contract suite plus every pass in
#                        build.clj's :check-order. JDK 8 is not supported:
#                        the invokedynamic bootstrap contract is
#                        incompatible there (CallSite.makeSite expands the
#                        static arguments there and passes them whole from
#                        JDK 9 on), and indy is the only dispatch path.
#   test-25 additionally runs verify-jar, because that is the JDK that ships.
#   publish            — build uberjar + smoke + upload + nightly release.
#                        Needs ALL four test jobs to pass, runs on JDK 25 only,
#                        and is skipped on pull_request (PRs get the test
#                        gate, only pushes to master / nightly tags publish).

jobs:
  test-11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-11-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-11-

      # Do not expand this back into a per-driver list. It was one, in four
      # places, and had drifted by three drivers while the suite beside it ran
      # all thirteen.
      - name: check (contract tests + every driver in :check-order)
        run: clojure -T:build check

  test-17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-17-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-17-

      # Do not expand this back into a per-driver list. It was one, in four
      # places, and had drifted by three drivers while the suite beside it ran
      # all thirteen.
      - name: check (contract tests + every driver in :check-order)
        run: clojure -T:build check

  test-21:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-21-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-21-

      # Do not expand this back into a per-driver list. It was one, in four
      # places, and had drifted by three drivers while the suite beside it ran
      # all thirteen.
      - name: check (contract tests + every driver in :check-order)
        run: clojure -T:build check

  test-25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-25-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-25-

      # Do not expand this back into a per-driver list. It was one, in four
      # places, and had drifted by three drivers while the suite beside it ran
      # all thirteen.
      - name: check (contract tests + every driver in :check-order)
        run: clojure -T:build check

      # Only this job, not all four: it is the JDK that ships, and this task
      # builds the uberjar itself when missing. A packaging regression should
      # fail a pull request, not surface first on the nightly publish.
      - name: Verify jar contents
        run: clojure -T:build verify-jar

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-11, test-17, test-21, test-25]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-25-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-25-

      - name: Build uberjar
        run: clojure -T:build uberjar

      - name: Smoke test the shipped jar
        run: |
          set -euo pipefail

          # `java -jar` reaches Main-Class, which is handed a nil
          # Instrumentation: it can never weave, so it does not try. It prints
          # a stub notice and returns 0. This used to wait for a server banner
          # from a feature that no longer exists, so the step failed on a jar
          # that was working exactly as designed.
          java -jar target/nihilite.jar > /tmp/nihilite-main.log 2>&1
          echo "--- java -jar output ---"
          cat /tmp/nihilite-main.log
          grep -q 'bytecode hook agent for the JVM' /tmp/nihilite-main.log
          grep -q 'nothing to run here' /tmp/nihilite-main.log

          # Then the part that actually matters for a published artifact:
          # mount it into a real JVM and prove a hook weaves and fires. This
          # is the only assertion in CI that exercises the shipped jar through
          # the production install! path.
          clojure -T:build javaagent-driver

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nihilite.jar
          path: target/nihilite.jar
          retention-days: 14

      - name: Update nightly tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly ${{ github.sha }}
          git push -f origin nightly

      - name: Publish nightly release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          files: target/nihilite.jar
          prerelease: true
          generate_release_notes: false
          body: |
            This is the upload-based build of the current `${{ github.ref_name }}`.

            This is **not** a release. It is a continuous build artifact that
            gets overwritten on every CI run.

            Build metadata:
            - commit: ${{ github.sha }}
            - ref: ${{ github.ref_name }}
            - run: ${{ github.run_id }}
            - actor: ${{ github.actor }}
