name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [master]
    tags:
      - 'nightly'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: nihilite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ matrix.java-version }}-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-${{ matrix.java-version }}-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build compiler-loader-driver
          clojure -T:build redefine-instance-driver
          clojure -T:build javaagent-driver

      - name: Build uberjar
        if: matrix.java-version == '25'
        run: clojure -T:build uberjar

      - name: Verify jar contents
        if: matrix.java-version == '25'
        run: clojure -T:build verify-jar

      - name: Smoke test jar startup
        if: matrix.java-version == '25'
        run: |
          set -euo pipefail
          PORT=$((10000 + RANDOM % 5000))
          java -Dnihilite.bind=127.0.0.1 -Dnihilite.port=$PORT -jar target/nihilite.jar > /tmp/nihilite-startup.log 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do
            sleep 1
            if grep -q '^\[Nihilite\] server .* ready on' /tmp/nihilite-startup.log; then
              echo "startup OK: $(grep '\[Nihilite\] server .* ready on' /tmp/nihilite-startup.log)"
              kill -9 $PID 2>/dev/null || true
              wait $PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "::error::jar exited before startup banner"
              cat /tmp/nihilite-startup.log
              exit 1
            fi
          done
          echo "::error::startup banner not seen within 30s"
          cat /tmp/nihilite-startup.log
          kill -9 $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v7
        if: success() && matrix.java-version == '25'
        with:
          name: nihilite.jar
          path: target/nihilite.jar
          retention-days: 14

      - name: Update nightly tag
        if: github.event_name == 'push' && matrix.java-version == '25'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly ${{ github.sha }}
          git push -f origin nightly

      - name: Publish nightly release
        if: github.event_name == 'push' && matrix.java-version == '25'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          files: target/nihilite.jar
          prerelease: true
          generate_release_notes: false
          body: |
            This is the upload-based build of the current `${{ github.ref_name }}`.

            This is **not** a release. It is a continuous build artifact that
            gets overwritten on every CI run.

            Build metadata:
            - commit: ${{ github.sha }}
            - ref: ${{ github.ref_name }}
            - run: ${{ github.run_id }}
            - actor: ${{ github.actor }}