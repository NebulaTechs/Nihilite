name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - run: ./gradlew --no-daemon clojureContractTest contractCheck

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - run: ./gradlew --no-daemon assemble verifyJarContents

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nihilite-jar
          path: build/libs/nihilite.jar
          retention-days: 14

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nihilite-jar
          path: build/libs

      - run: |
          echo "deploy: nihilite.jar artifact ready (built by build job, gated on test)"
          ls -la build/libs/
