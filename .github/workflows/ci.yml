name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - run: ./gradlew --no-daemon check

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nihilite-jar
          path: build/libs/nihilite.jar
          retention-days: 14