name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: nihilite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build compiler-loader-driver

      - name: Build uberjar
        run: clojure -T:build uberjar

      - name: Verify jar contents
        run: clojure -T:build verify-jar

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nihilite.jar
          path: target/nihilite.jar
          retention-days: 14

      - name: Set dev tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        run: echo "name=dev-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish dev release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: target/nihilite.jar
          generate_release_notes: true
