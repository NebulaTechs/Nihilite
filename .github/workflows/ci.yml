name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: nihilite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - run: ./gradlew --no-daemon clojureContractTest retransformDriver assemble verifyJarContents

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: nihilite.jar
          path: build/libs/nihilite.jar
          retention-days: 14

      - name: Publish dev release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-$(date -u +%Y%m%d-%H%M%S)
          files: build/libs/nihilite.jar
          generate_release_notes: true
