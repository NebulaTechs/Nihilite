name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [master]
    tags:
      - '0.*'
      - '0.*.*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: nihilite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ matrix.java-version }}-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-${{ matrix.java-version }}-

      - name: AOT compile
        run: clojure -T:build compile-clj

      - name: Contract tests
        run: clojure -T:build clojure-contract-test

      - name: Driver probes
        run: |
          clojure -T:build retransform-driver
          clojure -T:build compiler-loader-driver
          clojure -T:build redefine-instance-driver
          clojure -T:build javaagent-driver

      - name: Build uberjar
        if: matrix.java-version == '25'
        run: clojure -T:build uberjar

      - name: Verify jar contents
        if: matrix.java-version == '25'
        run: clojure -T:build verify-jar

      - uses: actions/upload-artifact@v7
        if: success() && matrix.java-version == '25'
        with:
          name: nihilite.jar
          path: target/nihilite.jar
          retention-days: 14

      - name: Set dev tag
        if: github.event_name == 'workflow_dispatch' && matrix.java-version == '25'
        id: tag
        run: echo "name=dev-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish dev snapshot release
        if: github.event_name == 'workflow_dispatch' && matrix.java-version == '25'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: target/nihilite.jar
          generate_release_notes: true

      - name: Publish prerelease (from tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.java-version == '25'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: target/nihilite.jar
          prerelease: true
          generate_release_notes: true
